    ActionIterator = (length) => {
      let i = 0;
      const first = ArrayUtils.range0(length);
      let permute = ArrayUtils.shuffle(first);
      return {
        next: () => {
          if (i < length) return permute[i++];
          permute = ArrayUtils.shuffle(first);
          i = 0;
          return permute[i++];
        },
      };
    };
    function seededRandom(seed) {
      let value = Number(seed) || 0;
      return function () {
        value = (value * 1664525 + 1013904223) >>> 0;
        return value / 4294967296;
      };
    }
    function seededShuffle(array, seed) {
      const result = [...array];
      const random = seededRandom(seed);
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }
    function chooseAnimationFromSeed(list, seed, round = 0, salt = 0) {
      if (!list || !list.length) return null;
      const order = seededShuffle(ArrayUtils.range0(list.length), Number(seed) + Number(salt));
      return list[order[round % list.length]];
    }
    function chooseAnimationCategoryFromSeed(map, category, seed, round = 0, salt = 0) {
      if (!map || !map[category] || !map[category].length) return null;
      const order = seededShuffle(ArrayUtils.range0(map[category].length), Number(seed) + Number(salt));
      return map[category][order[round % map[category].length]];
    }
    const copyToClipboard = (str) => {

function handleIncomingMessage(rawMessage) {
        let message = rawMessage;
        if (typeof rawMessage === "string") {
            try {
                message = JSON.parse(rawMessage);
            } catch (err) {
                console.warn("Invalid message received", rawMessage);
                return;
            }
        }

        if (remoteMessageResolvers.length > 0) {
            for (let i = 0; i < remoteMessageResolvers.length; i++) {
                if (
                    (remoteMessageResolvers[i].round === null || remoteMessageResolvers[i].round === message.round) &&
                    (message.type === "decision" || remoteMessageResolvers[i].round === null)
                ) {
                    const resolver = remoteMessageResolvers.splice(i, 1)[0];
                    resolver.resolve(message);
                    return;
                }
            }
        }

        incomingMessageQueue.push(message);
    }

    function waitForRemoteMessage() {
        return new Promise((resolve) => {
            if (incomingMessageQueue.length > 0) {
                resolve(incomingMessageQueue.shift());
            } else {
                remoteMessageResolvers.push({ round: null, resolve });
            }
        });
    }

    function waitForDecisionMessage(round) {
        for (let i = 0; i < incomingMessageQueue.length; i++) {
            const message = incomingMessageQueue[i];
            if (message && message.type === "decision" && message.round === round) {
                incomingMessageQueue.splice(i, 1);
                return Promise.resolve(message);
            }
        }
        return new Promise((resolve) => {
            remoteMessageResolvers.push({ round, resolve });
      });
    }

    function setupDataChannelHandlers(conn) {
      dataChannel = conn;
      conn.on("open", () => {
        connectionOpen = true;
        console.log("PeerJS connection open");
        if (menu && menu.Buttons && menu.Buttons["GoodText"]) {
          menu.Buttons["GoodText"].style.visibility = "visible";
          menu.Buttons["GoodText"].innerHTML =
            '<font color="green">WebRTC connected. Starting game...</font>';
        }
      });
      conn.on("data", (data) => {
        handleIncomingMessage(data);
      });
      conn.on("close", () => {
        connectionOpen = false;
        console.log("PeerJS connection closed");
      });
      conn.on("error", (err) => {
        console.warn("PeerJS connection error", err);
      });
    }

    async function setupWebRTCConnection() {
      if (connectionStarted) {
        return;
      }
      connectionStarted = true;
      const room = game.getRoomName();
      isHost = localStorage.getItem("webrtcHostRoom") === room;
      peer = new Peer(isHost ? room : undefined);

      await new Promise((resolve) => {
        const ready = () => {
          peer.off("open", ready);
          peer.off("error", ready);
          resolve();
        };
        peer.on("open", ready);
        peer.on("error", ready);
      });

      peer.on("error", (err) => {
        console.warn("Peer error", err);
      });

      if (isHost) {
        peer.on("connection", (conn) => {
          setupDataChannelHandlers(conn);
        });
        if (menu && menu.Buttons && menu.Buttons["GoodText"]) {
          menu.Buttons["GoodText"].innerHTML =
            '<font color="black">Host ready. Share key: ' + room + "</font>";
        }
      } else {
        const hostId = room;
        const conn = peer.connect(hostId);
        setupDataChannelHandlers(conn);
        conn.on("open", () => {
          console.log("Connected to host", hostId);
        });
        localStorage.removeItem("webrtcHostRoom");
      }
    }

      Timer(action, duration) {

        if (this.firstTime) {
          this.firstTime = false;
          //this.time=0;
          this.startTime = new Date().getTime();
        }

        this.dt = 1e-3 * (new Date().getTime() - this.startTime);

      //
      ActionAnimation() {
        //final stage
        if (this.ActionAnimationState == 4) {
          this.firstTime = true;
          //play Idle Animation
          time = 0;
          actualAnimationRunning = Idle[0];

          this.state++;
        }
        //Play Second Animation if exists
        if (this.ActionAnimationState == 3) {
          //duration in seconds of animation is total number of frames dividing per fps
          var time_of_animation = this.AnimationStack[1].length / fps;
          time_of_animation = time_of_animation * 1000; //turn seconds to miliseconds

          //Just set one  timer
          if (this.firstTime) {
            //time=0 is to play the animation from the beginning
            time = 0;
            //Just need to insert this one time
            actualAnimationRunning = this.AnimationStack[1];
            //set timer
            //var myfunction=function(){this.ActionAnimationState++;};
            setTimeout(this.NextAnimationState, time_of_animation);
            this.firstTime = false;
          }
        }
        //in between animations state
        if (this.ActionAnimationState == 2) {
          this.firstTime = true;
          //see if there is another animation to be played
          //if there is one then go to next state
          if (this.AnimationStack[1] != null) {
            this.ActionAnimationState++;
          }
          //else play idle animation and go to state 4
          else {
            //time=0 is to play the animation from the beginning
            time = 0;
            actualAnimationRunning = Idle[0];
            this.ActionAnimationState = 4;
          }
        }
        //Do the first animations which will always happen
        if (this.ActionAnimationState == 1) {
          //duration in seconds of animation is total number of frames dividing per fps
          var time_of_animation = this.AnimationStack[0].length / fps;
          time_of_animation = time_of_animation * 1000; //turn seconds to miliseconds

          if (this.firstTime) {
            //time=0 is to play the animation from the beginning
            time = 0;
            //Only need to insert one time this
            actualAnimationRunning = this.AnimationStack[0];
            //set timeout function
            //var myfunction=function(){this.ActionAnimationState++;};
            setTimeout(this.NextAnimationState, time_of_animation);
            this.firstTime = false;
          }
        }
        //Initialization state
        if (this.ActionAnimationState == 0) {
          //put the state of previous stage to zero
          this.processing_choice_state = 0;
          //put this var to true to be ready to use
          this.firstTime = true;
          //hide menus to just see animations
          menu.HideButtons();
          this.ActionAnimationState++;
        }
      }

      //
      CheckWinner() {
        //initialize prev state
        this.update_status_state = 0;

        //initialize options
        this.goodOptions = [];
        this.final_decision_good = [];

        this.evilOptions = [];
        this.final_decision_evil = [];

        this.AnimationStack = [];

        //check if Draw
        if (this.goodStatus[2] <= 0 && this.evilStatus[2] <= 0) {
          //Draw
          //In future show animation or not
          menu.HideButtons();
          //white backGround
          context.fillStyle = "white";
          context.fillRect(0, 0, canvas.width, canvas.height);
          var font_size;
          //more or less 10% font canvas width the font size
          //pick smaller size and ajust
          //vertical phone
          font_size = Math.round(0.1 * canvas.width);
          context.font = font_size + "px Comic Sans MS";
          context.fillStyle = "black";
          context.textAlign = "center";
          context.fillText("It's a Tie!", canvas.width / 2, canvas.height / 2);

          //
          endGame = true;
          this.restartEntriesInServer();
        } else {
          //see if there is a loser
          if (this.goodStatus[2] <= 0) {
            //Good Player Lose
            //In future show animation or not
            menu.HideButtons();
            //purple backGround
            context.fillStyle = "purple";
            context.fillRect(0, 0, canvas.width, canvas.height);
            var font_size;
            //more or less 10% font canvas width the font size
            //pick smaller size and ajust
            //vertical phone
            font_size = Math.round(0.1 * canvas.width);
            context.font = font_size + "px Comic Sans MS";
            context.fillStyle = "black";
            context.textAlign = "center";
            context.fillText("Evil Wins!", canvas.width / 2, canvas.height / 2);

            //
            endGame = true;
            this.restartEntriesInServer();
          } else {
            if (this.evilStatus[2] <= 0) {
              //Evil Player Lose
              //In future show animation or not
              menu.HideButtons();
              //purple backGround
              context.fillStyle = "cyan";
              context.fillRect(0, 0, canvas.width, canvas.height);
              var font_size;
              //more or less 10% font canvas width the font size
              //pick smaller size and ajust
              //vertical phone
              font_size = Math.round(0.1 * canvas.width);
              context.font = font_size + "px Comic Sans MS";
              context.fillStyle = "blue";
              context.textAlign = "center";
              context.fillText(
                "Good Wins!",
                canvas.width / 2,
                canvas.height / 2,
              );
              //
              endGame = true;
              this.restartEntriesInServer();
            }
            //No one had lost
            else {
              //return to the idle state of state machine
              this.state = 0;
              this.idle_state = 0;
              this.round++;
            }
          }
        }
      }

      //Main function of this class that is called once per frame
      //does Actions depending on this.state
      Run() {
        if (this.state == -2) {
          this.Nothing();
        }
        if (this.state == -1) {
          this.ChooseSide();
        }
        if (this.state == 0) {
          this.Idle();
        }
        if (this.state == 1) {
          this.Calculator();
        }
        if (this.state == 2) {
          this.ProcessWinningChoice();
        }
        if (this.state == 3) {
          this.ActionAnimation();
        }
        if (this.state == 4) {
          this.UpDateStatus();
        }
        if (this.state == 5) {
          this.CheckWinner();
        }
        if (this.state == 6) {
          this.GameOver();
        }
      }
    }

    function Draw(images_array) {
      dt = 1e-3 * (new Date().getTime() - startTime);
      startTime = new Date().getTime();
      time += dt % 10000;
      //fps=60
      var index = Math.floor(time * fps) % images_array.length;
      //console.log(index);
      var frame = images_array[index];
      if (frame.isReady) {
        context.drawImage(frame, 0, 0, window.innerWidth, window.innerHeight);
      }
    }
